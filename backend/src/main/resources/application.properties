# ============================================================
# KnowYourFinance backend configuration
# This file controls how the app behaves when it starts up.
# ============================================================

# --- Server ---
# The port comes from the PORT variable when a hosting service sets one,
# and falls back to 8080 on a laptop or in Docker Compose.
server.port=${PORT:8080}

# Finish in-flight requests before stopping, so a redeploy or a
# "docker stop" never cuts an upload off halfway through a save.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Compress JSON responses. The transaction list can be a few hundred
# rows of repeated field names, which shrinks a lot when gzipped.
server.compression.enabled=true
server.compression.mime-types=application/json
server.compression.min-response-size=1024

# Browser origins allowed to call the API directly. In Docker the web
# page is served from the same address as the API, so this only matters
# when the frontend runs on its own port (the Vite dev server).
kyf.cors.allowed-origins=${KYF_CORS_ORIGINS:http://localhost:5173}

# --- Database (Supabase-hosted PostgreSQL) ---
# This used to be a local H2 file (see build-log 12/15) - fine for one
# person developing on one laptop, but it meant the data only ever
# existed on whichever machine last ran the backend, with no way to
# share it, back it up, or deploy the app anywhere real. Supabase gives
# us an actual hosted Postgres database instead, reachable from any
# machine, which is what a real deployment needs.
#
# Connecting through Supabase's Session Pooler (port 5432) rather than
# a direct connection - the pooler works over IPv4, while a direct
# connection to Supabase requires IPv6 (or a paid IPv4 add-on), and we
# don't want "can my laptop even reach the database" depending on
# whose network it's on.
#
# The URL, username, and password all come from environment variables
# instead of being written here - a database password is a secret, not
# something that belongs in a file we commit to git. Each person
# running this locally sets these three in their own shell/IDE before
# starting the app; see README for where to find them in the Supabase
# dashboard (Project Settings > Database > Connection Pooling).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-0-us-east-1.pooler.supabase.com:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres.nmivkmwsxdbszuzbldyp}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver

# --- JPA / Hibernate ---
# "update" means Hibernate will automatically create/update database
# tables to match our Java classes as we build them. Convenient for
# development; we'll switch to managed migrations (Flyway) later so
# schema changes are tracked deliberately instead of auto-guessed. The
# `transactions` table already exists in Supabase (created directly,
# matching Transaction.java) - "update" will leave it alone unless our
# entities change, not recreate it.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL logging is off by default now. It was useful while we were
# learning what Hibernate generates, but printing every statement slows
# imports down and fills the logs. Turn it back on for a debugging
# session with the environment variable KYF_SHOW_SQL=true.
spring.jpa.show-sql=${KYF_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# By default Spring keeps a database connection checked out for the whole
# web request, even after the controller has the data it needs. Turning
# this off hands the connection back as soon as the query is done.
spring.jpa.open-in-view=false

# Supabase's pooler only allows a limited number of connections for the
# whole project, so we keep our own pool small instead of grabbing the
# default of ten and starving everyone else on the team.
spring.datasource.hikari.maximum-pool-size=${KYF_DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=10000

# --- Application identity ---
spring.application.name=knowyourfinance

# --- File upload (statement import) ---
# Caps how large an uploaded statement file (and the overall request)
# can be. Without this, Spring's default is 1MB per file, which a
# multi-page CSV/PDF statement could realistically exceed. 10MB is
# generous for a single statement while still blocking anything wildly
# oversized from tying up the server.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
