# ============================================================
# KnowYourFinance backend configuration
# This file controls how the app behaves when it starts up.
# ============================================================

# --- Server ---
server.port=8080

# --- Database (H2, saved to a local file, local dev only) ---
# This used to be "jdbc:h2:mem:kyfdb" - an IN-MEMORY database, meaning
# the data lived only in RAM. That had a sharp edge that only showed up
# in real use: H2 silently wipes an in-memory database the moment its
# last open connection closes, not just on an intentional app restart -
# so something as ordinary as a laptop going to sleep and the
# connection pool reconnecting afterward could (and did) make all the
# data vanish mid-session, with the backend process never actually
# stopping.
#
# "jdbc:h2:file:./data/kyfdb" instead writes the database to an actual
# file on disk, inside this backend folder (see .gitignore - that file
# is never committed, since it's local data, not code). Now the data
# survives restarts, sleep/wake cycles, and anything else short of
# deleting the file yourself. We'll still switch this to PostgreSQL
# before any real deployment (Milestone 4) - this is a fix for local
# development reliability, not the final production database.
spring.datasource.url=jdbc:h2:file:./data/kyfdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Lets us open http://localhost:8080/h2-console in a browser to see
# the database tables while developing. Must be disabled before any
# real deployment - never expose this in production.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# "update" means Hibernate will automatically create/update database
# tables to match our Java classes as we build them. Convenient for
# development; we'll switch to managed migrations (Flyway) later so
# schema changes are tracked deliberately instead of auto-guessed.
spring.jpa.hibernate.ddl-auto=update

# Prints the actual SQL Hibernate generates to the console - helpful
# for learning what's happening under the hood. Turn off later once
# it's just noise.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Application identity ---
spring.application.name=knowyourfinance

# --- File upload (statement import) ---
# Caps how large an uploaded statement file (and the overall request)
# can be. Without this, Spring's default is 1MB per file, which a
# multi-page CSV/PDF statement could realistically exceed. 10MB is
# generous for a single statement while still blocking anything wildly
# oversized from tying up the server.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
