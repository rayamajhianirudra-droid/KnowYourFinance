server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Send text files over the wire compressed.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Anything under /api goes to the backend container. The browser only
  # ever talks to this one address, so there is no cross-origin trouble.
  location /api/ {
    proxy_pass http://backend:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Uploads can be up to 10 MB, so let nginx pass them through.
    client_max_body_size 11m;
  }

  # Built files have a hash in their name, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # The page itself must always be fresh so new deploys show up at once.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
