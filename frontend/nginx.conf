server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Send text files over the wire compressed.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers for every response. Any location below that uses
  # add_header must include this file again, or it loses them.
  include /etc/nginx/snippets/security-headers.conf;

  # Anything under /api goes to the backend container. The browser only
  # ever talks to this one address, so there is no cross-origin trouble.
  location /api/ {
    # Docker's built in DNS. Using a variable makes nginx look the backend
    # up when a request arrives, not at startup, so the web server still
    # starts (and serves the page) even if the backend is not up yet.
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    # The page and the API share one address, so this is not a cross origin
    # request. Browsers still add an Origin header to uploads and form
    # posts, and the backend would refuse any address it was not told
    # about with a 403. Removing the header here makes this work at any
    # port or host name without configuration.
    proxy_set_header Origin "";
    # Up to 12 statements of 10 MB each in one upload, so let nginx pass them through.
    client_max_body_size 125m;
  }

  # Built files have a hash in their name, so they can be cached for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The page itself must always be fresh so new deploys show up at once.
  location / {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
