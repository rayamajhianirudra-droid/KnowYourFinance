# Security headers, included by nginx.conf.
#
# nginx only passes add_header lines down to a location that has none of
# its own. So this file is included at server level and again inside every
# location that sets another header.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Scripts may only come from this address, so inline scripts do not run.
# 'wasm-unsafe-eval' lets the receipt reader start its WebAssembly engine.
# blob: images let the person preview the receipt photo they picked.
# The two Google addresses serve the Inter font used by index.html.
# If the frontend is built with VITE_API_BASE_URL pointing at another
# server, add that server to connect-src or the browser will block it.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
