name: Docker images

# Builds the backend and frontend images. On a pull request this only
# proves the images still build. On main it also publishes them to the
# GitHub Container Registry, so any server can pull a ready made version
# with "docker pull" instead of building from source.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Only log in when we are going to push. Pull requests from forks do
      # not get a token that can write packages.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lowercase, and the repository owner is not.
      - name: Work out the image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # The cache keeps layers such as "downloaded Maven dependencies"
      # between runs, so most builds take a fraction of the first one.
      - name: Build (and push on main)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Starts the real frontend image and checks it serves the page, so a
  # broken nginx config is caught before anyone deploys it.
  frontend-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Build and run the frontend image
        run: |
          docker build -t kyf-frontend frontend
          docker run -d --name kyf-web -p 3000:80 kyf-frontend
          for i in $(seq 1 15); do
            curl -fsS http://localhost:3000/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:3000/ | grep -q "<div id=\"root\">"
          # A deep link must fall back to the app, not return a 404.
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:3000/some/deep/link | grep -q 200
      - name: Security headers are sent with the page and its files
        run: |
          asset=$(curl -fsS http://localhost:3000/ | grep -o '/assets/[^"]*\.js' | head -n 1)
          test -n "$asset"
          for path in / /some/deep/link /theme-init.js "$asset"; do
            echo "Checking $path"
            headers=$(curl -fsSI "http://localhost:3000$path")
            for name in X-Content-Type-Options X-Frame-Options Referrer-Policy Permissions-Policy Content-Security-Policy; do
              echo "$headers" | grep -qi "^$name:" || { echo "$name is missing"; exit 1; }
            done
          done
          # The theme script must be a real file, not the page returned as a fallback.
          curl -fsS http://localhost:3000/theme-init.js | grep -q "kyf-theme"
      - name: Show container logs if something failed
        if: failure()
        run: docker logs kyf-web

  # Follows the grading steps exactly: copy .env.example to .env, run
  # "docker compose up --build", use the app, then stop it and start it
  # again to prove the data survives in the database volume.
  full-stack-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Start the whole app
        run: |
          cp .env.example .env
          docker compose up --build -d --wait --wait-timeout 300
      - name: Health check through the web address
        run: curl -fsS http://localhost:3000/api/health
      - name: Create a synthetic account for the smoke test
        run: |
          jar="$RUNNER_TEMP/kyf-cookies"
          password=$(openssl rand -hex 24)
          csrf=$(curl -fsS -c "$jar" http://localhost:3000/api/auth/csrf | jq -er .token)
          curl -fsS -b "$jar" -c "$jar" -H "X-CSRF-TOKEN: $csrf" -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg pw "$password" '{email:"smoke@example.test",password:$pw}')" \
            http://localhost:3000/api/auth/signup
          curl -fsS -b "$jar" http://localhost:3000/api/auth/session | grep -q 'smoke@example.test'
          printf '%s' "$password" > "$RUNNER_TEMP/kyf-smoke-password"
      - name: Save a transaction and read it back
        run: |
          jar="$RUNNER_TEMP/kyf-cookies"
          csrf=$(curl -fsS -b "$jar" http://localhost:3000/api/auth/csrf | jq -er .token)
          curl -fsS -b "$jar" -H "X-CSRF-TOKEN: $csrf" -X POST http://localhost:3000/api/transactions \
            -H "Content-Type: application/json" \
            -d '{"date":"2026-11-01","description":"Smoke test coffee","amount":4.5,"type":"EXPENSE"}'
          curl -fsS -b "$jar" "http://localhost:3000/api/transactions" | grep -q "Smoke test coffee"
      - name: Invalid input is rejected with a message
        run: |
          jar="$RUNNER_TEMP/kyf-cookies"
          csrf=$(curl -fsS -b "$jar" http://localhost:3000/api/auth/csrf | jq -er .token)
          code=$(curl -s -o /tmp/err.json -w "%{http_code}" -b "$jar" -H "X-CSRF-TOKEN: $csrf" -X POST http://localhost:3000/api/transactions \
            -H "Content-Type: application/json" -d '{}')
          test "$code" = "400"
      - name: Requests that carry a browser Origin header are accepted
        run: |
          jar="$RUNNER_TEMP/kyf-cookies"
          csrf=$(curl -fsS -b "$jar" http://localhost:3000/api/auth/csrf | jq -er .token)
          # A real browser adds this header. curl does not, which is why a
          # plain curl check once missed a 403 on every upload and form post.
          code=$(curl -s -o /dev/null -w "%{http_code}" -b "$jar" -H "X-CSRF-TOKEN: $csrf" -X POST http://localhost:3000/api/transactions \
            -H "Origin: http://localhost:3000" -H "Content-Type: application/json" \
            -d '{"date":"2026-11-02","description":"Origin header check","amount":1,"type":"EXPENSE"}')
          test "$code" = "200"
          printf 'Date,Description,Amount\n2026-01-06,ORIGIN UPLOAD CHECK,-2.00\n' > origin.csv
          code=$(curl -s -o /dev/null -w "%{http_code}" -b "$jar" -H "X-CSRF-TOKEN: $csrf" -X POST "http://localhost:3000/api/statements/upload-batch" \
            -H "Origin: http://localhost:3000" -F "files=@origin.csv")
          test "$code" = "200"
      - name: Upload several statements at once, in different formats
        run: |
          jar="$RUNNER_TEMP/kyf-cookies"
          csrf=$(curl -fsS -b "$jar" http://localhost:3000/api/auth/csrf | jq -er .token)
          printf 'Date,Description,Amount\n2026-01-05,JAN COFFEE SHOP,-4.50\n' > jan.csv
          printf 'Date\tDescription\tAmount\n02/06/2026\tFEB BOOKSTORE\t($12.00)\n' > feb.tsv
          curl -fsS -b "$jar" -H "X-CSRF-TOKEN: $csrf" -X POST "http://localhost:3000/api/statements/upload-batch" \
            -F "files=@jan.csv" -F "files=@feb.tsv" | tee batch.json
          grep -q '"filesSucceeded":2' batch.json
          curl -fsS -b "$jar" "http://localhost:3000/api/transactions" | grep -q "FEB BOOKSTORE"
      - name: A thirteenth file is refused
        run: |
          jar="$RUNNER_TEMP/kyf-cookies"
          csrf=$(curl -fsS -b "$jar" http://localhost:3000/api/auth/csrf | jq -er .token)
          args=""
          for i in $(seq 1 13); do printf 'Date,Description,Amount\n' > "m$i.csv"; args="$args -F files=@m$i.csv"; done
          code=$(curl -s -o /tmp/too-many.json -w "%{http_code}" -b "$jar" -H "X-CSRF-TOKEN: $csrf" -X POST \
            "http://localhost:3000/api/statements/upload-batch" $args)
          test "$code" = "400"
          grep -q "at most 12 files" /tmp/too-many.json
      - name: Data survives stop and start
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 300
          jar="$RUNNER_TEMP/kyf-cookies"
          csrf=$(curl -fsS -c "$jar" http://localhost:3000/api/auth/csrf | jq -er .token)
          password=$(cat "$RUNNER_TEMP/kyf-smoke-password")
          curl -fsS -b "$jar" -c "$jar" -H "X-CSRF-TOKEN: $csrf" -H 'Content-Type: application/json' \
            -d "$(jq -cn --arg pw "$password" '{email:"smoke@example.test",password:$pw}')" \
            http://localhost:3000/api/auth/signin
          rm "$RUNNER_TEMP/kyf-smoke-password"
          curl -fsS -b "$jar" "http://localhost:3000/api/transactions" | grep -q "Smoke test coffee"
          curl -fsS -b "$jar" "http://localhost:3000/api/transactions" | grep -q "FEB BOOKSTORE"
      - name: Verify financial planning in a mobile browser
        run: |
          npm install --prefix "$RUNNER_TEMP/kyf-browser" --no-audit --no-fund playwright@1.58.2
          NODE_PATH="$RUNNER_TEMP/kyf-browser/node_modules" node frontend/tests/financial-planning-smoke.cjs
      - name: Show logs if something failed
        if: failure()
        run: docker compose logs --tail=100
