name: Docker images

# Builds the backend and frontend images. On a pull request this only
# proves the images still build. On main it also publishes them to the
# GitHub Container Registry, so any server can pull a ready made version
# with "docker pull" instead of building from source.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend]

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in when we are going to push. Pull requests from forks do
      # not get a token that can write packages.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Registry names must be lowercase, and the repository owner is not.
      - name: Work out the image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.service }}" >> "$GITHUB_OUTPUT"

      # The cache keeps layers such as "downloaded Maven dependencies"
      # between runs, so most builds take a fraction of the first one.
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # Starts the real frontend image and checks it serves the page, so a
  # broken nginx config is caught before anyone deploys it.
  frontend-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the frontend image
        run: |
          docker build -t kyf-frontend frontend
          docker run -d --name kyf-web -p 3000:80 kyf-frontend
          for i in $(seq 1 15); do
            curl -fsS http://localhost:3000/ >/dev/null && break
            sleep 1
          done
          curl -fsS http://localhost:3000/ | grep -q "<div id=\"root\">"
          # A deep link must fall back to the app, not return a 404.
          curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:3000/some/deep/link | grep -q 200
      - name: Show container logs if something failed
        if: failure()
        run: docker logs kyf-web
